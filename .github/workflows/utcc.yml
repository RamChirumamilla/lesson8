name: unit testing and code coverage

on: pull_request

jobs:
    build:
        permissions:
            checks: write
            pull-requests: write
            contents: write
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7.0.1
            -   uses: actions/setup-node@v7.1.0
                with: 
                    node-version: 24
            - run: npm ci
            - run: npm test
            - uses: ArtiomTr/jest-coverage-report-action@v2



                        

